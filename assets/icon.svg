<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Vigil – "Radar": Schild im Radarkreis auf Tiefblau -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6c8"/>
      <stop offset="1" stop-color="#5b60f0"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#2ee6c8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2ee6c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#2ee6c8" flood-opacity=".55"/>
    </filter>
    <clipPath id="clip"><rect x="72" y="64" width="880" height="880" rx="210"/></clipPath>
  </defs>

  <g filter="url(#shadow)"><rect x="72" y="64" width="880" height="880" rx="210" fill="url(#tile)"/></g>
  <g clip-path="url(#clip)">
    <g fill="none" stroke="#2ee6c8">
      <circle cx="512" cy="530" r="200" stroke-opacity=".3" stroke-width="12"/>
      <circle cx="512" cy="530" r="310" stroke-opacity=".17" stroke-width="12"/>
      <circle cx="512" cy="530" r="420" stroke-opacity=".08" stroke-width="12"/>
    </g>
    <path d="M512 530 L512 110 A420 420 0 0 1 875 320 Z" fill="url(#sweep)" opacity=".75"/>
    <circle cx="744" cy="300" r="14" fill="#2ee6c8" opacity=".9"/>
    <rect x="72" y="64" width="880" height="880" fill="url(#sheen)"/>
  </g>
  <rect x="74" y="66" width="876" height="876" rx="208" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="4"/>

  <path filter="url(#glow)" fill="url(#shield)" d="M512 330 C552 352 600 368 648 374 V492 C648 582 588 650 512 690 C436 650 376 582 376 492 V374 C424 368 472 352 512 330 Z"/>
  <circle cx="512" cy="500" r="40" fill="#fff"/>
</svg>
