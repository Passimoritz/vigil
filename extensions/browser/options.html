<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vigil – settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <header><span class="logo" aria-hidden="true"></span><b>Vigil – connection</b></header>
  <p class="muted small">In Vigil: Settings → Advanced → Local REST API → enable it and copy the token. The extension only talks to 127.0.0.1.</p>
  <label for="port">Port</label>
  <input id="port" type="number" min="1024" max="65535" value="7811">
  <label for="token">API token</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">
  <button id="save" type="button">Save</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
